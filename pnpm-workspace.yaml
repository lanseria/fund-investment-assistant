catalogMode: prefer

strictPeerDependencies: false
shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1

packages: []
catalogs:
  backend:
    '@nuxtjs/mcp-toolkit': ^0.18.1
    '@types/pg': ^8.21.0
    argon2: ^0.45.1
    drizzle-kit: ^0.31.10
    drizzle-orm: ^0.45.2
    iconv-lite: ^0.7.3
    openai: ^7.4.0
    pg: ^8.23.0
    secure-exec: ^0.3.3
  build:
    '@nuxt/eslint': ^1.17.0
    '@nuxtjs/color-mode': ^4.0.1
    '@pinia/nuxt': ^1.0.2
    '@unocss/eslint-config': ^66.7.5
    '@unocss/nuxt': ^66.7.5
    '@unocss/preset-web-fonts': ^66.7.5
    '@vueuse/nuxt': ^14.4.0
    nuxt: ^4.5.2
    unocss: ^66.7.5
  dev:
    '@antfu/eslint-config': ^9.3.0
    '@nuxt/test-utils': ^4.1.0
    eslint: ^10.8.1
    eslint-plugin-format: ^2.0.1
    typescript: ^6.0.3
    vitest: ^4.1.10
    vue-tsc: ^3.3.9
  frontend:
    '@vueuse/components': ^14.4.0
    '@vueuse/core': ^14.4.0
    echarts: ^6.1.0
    markdown-exit: ^1.1.0-beta.2
    nuxt-echarts: ^1.0.1
    pinia: ^4.0.3
    vue: ^3.5.41
    vue-echarts: ^8.1.0
  icons:
    '@iconify-json/carbon': ^1.2.25
    '@iconify-json/f7': ^1.2.2
    '@iconify-json/twemoji': ^1.2.5
  utils:
    bignumber.js: ^11.1.5
    date-fns: ^4.4.0
    es-toolkit: ^1.50.0
    mitt: ^3.0.1
    paseto-ts: ^2.0.6
    zod: ^4.4.3
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
allowBuilds:
  '@parcel/watcher': true
  argon2: true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
